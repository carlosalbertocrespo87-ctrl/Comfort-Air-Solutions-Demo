[build]
  command = "pnpm install --no-frozen-lockfile && PORT=4173 BASE_PATH=/ pnpm --dir artifacts/ar-sims-ga run build"
  publish = "artifacts/ar-sims-ga/dist/public"

[build.environment]
  PNPM_VERSION = "10.14.0"
  NODE_VERSION = "22"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
