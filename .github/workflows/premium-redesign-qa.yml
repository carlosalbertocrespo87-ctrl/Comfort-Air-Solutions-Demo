name: Premium redesign QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - artifacts/hvac-prospect-template
          - artifacts/wade-heating-air
          - artifacts/new-level-mechanical
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir ${{ matrix.artifact }} run typecheck
      - name: Production build
        env:
          BASE_PATH: ./
          PORT: 4173
        run: pnpm --dir ${{ matrix.artifact }} run build
