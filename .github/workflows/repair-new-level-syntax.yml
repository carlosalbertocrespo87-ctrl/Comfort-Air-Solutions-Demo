name: Repair New Level Syntax

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-new-level-syntax.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix exact syntax typo
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/new-level-mechanical/src/App.tsx")
          text = path.read_text()
          old = '''        ))}
      </div>
      {step !== "done" ? ('''
          new = '''        )}
      </div>
      {step !== "done" ? ('''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one syntax target, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/new-level-mechanical/src/App.tsx
          git commit -m "Fix New Level chat syntax"
          git push
