name: Repair New Level Syntax

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-new-level-syntax.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix syntax typo
        run: sed -i '1240s/))}/)}/' artifacts/new-level-mechanical/src/App.tsx

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/new-level-mechanical/src/App.tsx
          git commit -m "Fix New Level chat syntax"
          git push
