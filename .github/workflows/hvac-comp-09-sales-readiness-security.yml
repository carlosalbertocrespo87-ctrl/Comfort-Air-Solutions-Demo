name: HVAC COMP 09 Sales Readiness Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/sales-readiness/**'
      - 'docs/hvac-comp/batch-09-progress.md'
      - '.github/workflows/hvac-comp-09-sales-readiness-security.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - feature/hvac-comp-batch-09-sales-readiness
    paths:
      - 'src/sales-readiness/**'
      - 'docs/hvac-comp/batch-09-progress.md'
      - '.github/workflows/hvac-comp-09-sales-readiness-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-readiness-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck executable Batch 09 contract surface
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler src/sales-readiness/batch-09.spec.ts

      - name: Run executable Batch 09 contracts
        run: pnpm dlx tsx@4.20.6 src/sales-readiness/batch-09.spec.ts

      - name: Enforce fail-closed sales readiness boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'externalActionAuthorized:false' src/sales-readiness/contact-suppression.ts
          grep -F 'sendAuthorized:false' src/sales-readiness/first-touch-draft.ts
          grep -F 'sendAuthorized:false' src/sales-readiness/bilingual-message.ts
          grep -F 'outreachAuthorized:false' src/sales-readiness/channel-readiness.ts
          grep -F 'executionAuthorized:false' src/sales-readiness/outreach-experiment.ts
          grep -F 'spendAuthorized:false' src/sales-readiness/outreach-experiment.ts
          grep -F 'mailAuthorized:false' src/sales-readiness/direct-mail-readiness.ts
          grep -F 'proposalAuthorized:false' src/sales-readiness/proposal-readiness.ts
          grep -F 'externalActionsAuthorized:false' src/sales-readiness/owner-sales-report.ts
          ! grep -R -E '(sendRealEmail|sendRealSms|placeRealCall|sendRealMail|writeLiveCrm|chargeRealCustomer|activateOutreach|activateProduction)[[:space:]]*\(' src/sales-readiness
