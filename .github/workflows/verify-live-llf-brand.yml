name: Verify Live LLF Brand

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-llf-brand.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-live-llf-brand.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-brand:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official site, premium brand, and first outreach batch demos
        shell: bash
        run: |
          set -euo pipefail

          fetch_with_retry() {
            local url="$1"
            local out="$2"
            local attempts=24
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent --show-error --location --max-time 20 "$url" -o "$out"; then
                return 0
              fi
              echo "Attempt $attempt/$attempts failed for $url; retrying..."
              sleep 5
            done
            echo "::error::Unable to fetch $url"
            return 1
          }

          verify_demo() {
            local route="$1"
            local key="${route//[^a-zA-Z0-9]/_}"
            local base="https://localleadforge.com/$route/"
            local html="/tmp/${key}.html"
            local logo="/tmp/${key}-logo.svg"
            local robots="/tmp/${key}-robots.txt"

            echo "Verifying $base"
            fetch_with_retry "$base" "$html"
            fetch_with_retry "${base}llf-premium-logo.svg" "$logo"
            fetch_with_retry "${base}robots.txt" "$robots"

            grep -Fq 'llf-premium-logo.svg' "$html"
            grep -Fq 'LOCAL LEAD FORGE' "$logo"
            grep -Fq 'Turn more visitors into booked jobs.' "$logo"
            grep -Fqi 'noindex' "$html"
            grep -Fq 'Disallow: /' "$robots"
          }

          fetch_with_retry "https://localleadforge.com/" /tmp/official.html
          fetch_with_retry "https://localleadforge.com/llf-premium-logo.svg" /tmp/official-logo.svg
          grep -Fq 'llf-premium-logo.svg' /tmp/official.html
          grep -Fq 'LOCAL LEAD FORGE' /tmp/official-logo.svg
          grep -Fq 'Turn more visitors into booked jobs.' /tmp/official-logo.svg

          verify_demo "asap-heating-air-demo"
          verify_demo "wade-demo"
          verify_demo "new-level-mechanical-demo"
          verify_demo "ar-sims-heating-air-demo"
          verify_demo "coolpro-heating-cooling-demo"

          echo "Live verification passed: official LLF brand and every first-batch demo are publicly serving the premium logo/slogan and demo safety metadata."
