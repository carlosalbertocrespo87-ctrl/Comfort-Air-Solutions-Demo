name: Deploy Local Lead Forge

on:
  push:
    branches:
      - main
    paths:
      - "artifacts/local-lead-forge/**"
      - "artifacts/wade-heating-air/**"
      - ".github/workflows/local-lead-forge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Local Lead Forge
        env:
          BASE_PATH: ./
        run: pnpm --dir artifacts/local-lead-forge run build

      - name: Build Wade Demo
        env:
          PORT: 3000
          BASE_PATH: /wade-demo/
        run: pnpm --dir artifacts/wade-heating-air run build

      - name: Build ComfortAir Demo
        env:
          PORT: 3000
          BASE_PATH: /comfortair-demo/
        run: pnpm --dir artifacts/comfortair-solutions run build

      - name: Assemble GitHub Pages site
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/wade-demo pages-dist/comfortair-demo
          cp -R artifacts/local-lead-forge/dist/public/. pages-dist/
          cp -R artifacts/wade-heating-air/dist/public/. pages-dist/wade-demo/
          cp -R artifacts/comfortair-solutions/dist/public/. pages-dist/comfortair-demo/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
