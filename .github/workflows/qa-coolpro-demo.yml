name: QA CoolPro Premium Demo

on:
  push:
    branches:
      - coolpro-demo-build
    paths:
      - "artifacts/coolpro-ga/**"
      - ".github/workflows/qa-coolpro-demo.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: coolpro-demo-build
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate
          pnpm --version

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck prospect demo
        env:
          PORT: "4173"
          BASE_PATH: "/coolpro-demo/"
        run: pnpm --dir artifacts/coolpro-ga run typecheck

      - name: Production build prospect demo
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: "/coolpro-demo/"
        run: pnpm --dir artifacts/coolpro-ga run build

      - name: Verify premium, bilingual, safety and funnel markers
        run: |
          test -f artifacts/coolpro-ga/src/premium-demo.css
          grep -q "Disallow: /" artifacts/coolpro-ga/public/robots.txt
          grep -q "SelfClosingFunnel" artifacts/coolpro-ga/vite.config.ts
          grep -q "Unofficial sales demo" artifacts/coolpro-ga/src/App.tsx
          grep -q "en:" artifacts/coolpro-ga/src/App.tsx
          grep -q "es:" artifacts/coolpro-ga/src/App.tsx
