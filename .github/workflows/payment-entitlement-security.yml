name: Payment Entitlement Security Gate

on:
  pull_request:
    paths:
      - "artifacts/local-lead-forge/backend/012_payment_entitlement_foundation.sql"
      - "artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.sql"
      - "artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.test.sql"
      - "artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.sql"
      - "artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.test.sql"
      - "artifacts/local-lead-forge/supabase/functions/llf-legal-acceptance/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-payment-context/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-payment-events/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-checkout-orchestration/**"
      - ".github/workflows/payment-entitlement-security.yml"
  push:
    branches:
      - main
    paths:
      - "artifacts/local-lead-forge/backend/012_payment_entitlement_foundation.sql"
      - "artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.sql"
      - "artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.test.sql"
      - "artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.sql"
      - "artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.test.sql"
      - "artifacts/local-lead-forge/supabase/functions/llf-legal-acceptance/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-payment-context/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-payment-events/**"
      - "artifacts/local-lead-forge/supabase/functions/llf-checkout-orchestration/**"
      - ".github/workflows/payment-entitlement-security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-entitlement-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-security-tests:
    name: Stripe signature, correlation, reconciliation and orchestration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run payment context tests
        run: deno test artifacts/local-lead-forge/supabase/functions/llf-payment-context/*.test.ts
      - name: Run payment event tests
        run: deno test artifacts/local-lead-forge/supabase/functions/llf-payment-events/*.test.ts
      - name: Run checkout orchestration tests
        run: deno test artifacts/local-lead-forge/supabase/functions/llf-checkout-orchestration/*.test.ts
      - name: Guard accidental checkout/onboarding activation
        run: |
          ! grep -R "onboarding_triggered: true" artifacts/local-lead-forge/supabase/functions
          ! grep -R "checkout.sessions.create" artifacts/local-lead-forge/supabase/functions
          ! grep -R "paymentLinks.create" artifacts/local-lead-forge/supabase/functions

  payment-sql-regression:
    name: Isolated PostgreSQL entitlement regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: llf_payment_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llf_payment_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated payment schema
        run: |
          psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create or replace function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin; end if;
          end $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 -f artifacts/local-lead-forge/backend/012_payment_entitlement_foundation.sql
          psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 -f artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.sql
          psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 -f artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.sql
      - name: Run atomic apply regression
        run: psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 -f artifacts/local-lead-forge/backend/013_payment_entitlement_atomic_apply.test.sql
      - name: Run correlation bootstrap regression
        run: psql -h 127.0.0.1 -U postgres -d llf_payment_qa -v ON_ERROR_STOP=1 -f artifacts/local-lead-forge/backend/014_payment_correlation_bootstrap.test.sql
