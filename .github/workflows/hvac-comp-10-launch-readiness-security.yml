name: HVAC COMP 10 Launch Readiness Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/launch-readiness/**'
      - 'src/reports/executive-launch-readiness.ts'
      - 'docs/hvac-comp/batch-10-progress.md'
      - '.github/workflows/hvac-comp-10-launch-readiness-security.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - feature/hvac-comp-batch-10-launch-readiness
    paths:
      - 'src/launch-readiness/**'
      - 'src/reports/executive-launch-readiness.ts'
      - 'docs/hvac-comp/batch-10-progress.md'
      - '.github/workflows/hvac-comp-10-launch-readiness-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-readiness-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck executable Batch 10 contract surface
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler src/launch-readiness/batch-10.spec.ts

      - name: Run executable Batch 10 contracts
        run: pnpm dlx tsx@4.20.6 src/launch-readiness/batch-10.spec.ts

      - name: Enforce fail-closed Client #1 launch boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'releaseAuthorized:false' src/launch-readiness/launch-gates.ts
          grep -F 'legalActionAuthorized:false' src/launch-readiness/address-legal-readiness.ts
          grep -F 'addressChangeAuthorized:false' src/launch-readiness/address-legal-readiness.ts
          grep -F 'chargeAuthorized:false' src/launch-readiness/payment-readiness.ts
          grep -F 'refundAuthorized:false' src/launch-readiness/payment-readiness.ts
          grep -F 'productionTrafficAuthorized:false' src/launch-readiness/customer-zero-simulation.ts
          grep -F 'productionReleaseAuthorized:false' src/launch-readiness/release-decision.ts
          grep -F 'productionReleaseAuthorized:false' src/reports/executive-launch-readiness.ts
          ! grep -R -E '(activateProduction|releaseCustomerTraffic|createRealCheckout|chargeRealCustomer|refundRealCustomer|sendRealOutreach|sendRealMessage|writeLiveCrm)[[:space:]]*\(' \
            src/launch-readiness src/reports/executive-launch-readiness.ts
