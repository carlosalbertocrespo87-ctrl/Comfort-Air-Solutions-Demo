name: LLF Live Chatbot Post-Fix Smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-chatbot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install chromium

      - name: Verify exact production chatbot regression
        run: pnpm dlx @playwright/test@1.55.0 test .github/qa/llf-live-chatbot-postfix.spec.ts --workers=1 --reporter=line
