name: HVAC COMP 05 Retention Analytics Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/retention/**'
      - 'src/analytics/**'
      - 'docs/hvac-comp/batch-05-progress.md'
      - '.github/workflows/hvac-comp-05-retention-analytics-security.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - feature/hvac-comp-batch-05-retention-analytics
    paths:
      - 'src/retention/**'
      - 'src/analytics/**'
      - 'docs/hvac-comp/batch-05-progress.md'
      - '.github/workflows/hvac-comp-05-retention-analytics-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-analytics-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck executable Batch 05 contract surface
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler src/retention/batch-05.spec.ts

      - name: Run executable Batch 05 contracts
        run: pnpm dlx tsx@4.20.6 src/retention/batch-05.spec.ts

      - name: Enforce fail-closed retention and analytics boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'externalActionAllowed:false' src/retention/retention-regression.ts
          grep -F 'externalActionAuthorized:false' src/retention/retention-audit.ts
          grep -F 'pricingAuthorized:false' src/retention/cross-sell-score.ts
          grep -F 'CONFIRMED_FINANCIAL_EVIDENCE_REQUIRED' src/analytics/margin-roi.ts
          grep -F 'CONFIRMED_REVENUE_EVIDENCE_REQUIRED' src/analytics/recovered-revenue-dashboard.ts
          ! grep -R -E '(sendRealReview|sendRealRecall|sendRealRenewal|sendRealCrossSell|writeLiveCrm|chargeRealCustomer|activateProduction)[[:space:]]*\(' \
            src/retention src/analytics
