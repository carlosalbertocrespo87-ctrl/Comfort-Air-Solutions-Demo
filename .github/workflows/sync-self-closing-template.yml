name: Sync Self-Closing Funnel Template

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-self-closing-template.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Copy validated funnel into master template
        run: |
          mkdir -p artifacts/hvac-prospect-template/src/components
          cp artifacts/new-level-mechanical/src/components/self-closing-funnel.tsx artifacts/hvac-prospect-template/src/components/self-closing-funnel.tsx

      - name: Commit reusable component
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/hvac-prospect-template/src/components/self-closing-funnel.tsx
          git commit -m "Add reusable Self-Closing Funnel v1 to HVAC template"
          git push
