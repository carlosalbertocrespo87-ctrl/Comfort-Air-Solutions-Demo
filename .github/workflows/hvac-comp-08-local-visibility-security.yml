name: HVAC COMP 08 Local Visibility Security Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/local-visibility/**'
      - 'src/reports/local-visibility-owner-report.ts'
      - 'docs/hvac-comp/batch-08-progress.md'
      - '.github/workflows/hvac-comp-08-local-visibility-security.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - feature/hvac-comp-batch-08-local-visibility
    paths:
      - 'src/local-visibility/**'
      - 'src/reports/local-visibility-owner-report.ts'
      - 'docs/hvac-comp/batch-08-progress.md'
      - '.github/workflows/hvac-comp-08-local-visibility-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-visibility-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck executable Batch 08 contract surface
        run: pnpm exec tsc --noEmit --target ES2022 --module ESNext --moduleResolution Bundler src/local-visibility/batch-08.spec.ts

      - name: Run executable Batch 08 contracts
        run: pnpm dlx tsx@4.20.6 src/local-visibility/batch-08.spec.ts

      - name: Enforce fail-closed local visibility boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'externalMutationAuthorized:false' src/local-visibility/profile-facts.ts
          grep -F 'reviewGatingAllowed:false' src/local-visibility/review-readiness.ts
          grep -F 'communicationAuthorized:false' src/local-visibility/review-readiness.ts
          grep -F 'externalActionAuthorized:false' src/local-visibility/review-response-draft.ts
          grep -F 'automaticMergeAuthorized:false' src/local-visibility/duplicate-listing-risk.ts
          grep -F 'externalWriteAuthorized:false' src/local-visibility/gbp-change-proposal.ts
          grep -F 'guaranteesRanking:false' src/reports/local-visibility-owner-report.ts
          ! grep -R -E '(writeGoogleBusinessProfile|updateLiveListing|sendRealReviewRequest|sendRealReviewResponse|buyRankingTool|activatePaidListing|activateProduction)[[:space:]]*\(' \
            src/local-visibility src/reports/local-visibility-owner-report.ts
