name: Stage 7 Conversion QA

on:
  pull_request:
    paths:
      - 'artifacts/hvac-prospect-template/**'
      - 'artifacts/prospect-configs/**'
      - '.github/workflows/stage7-conversion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage7-conversion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prospect:
          - asap-heating-air
          - wade-heating-air
          - new-level-mechanical
          - ar-sims-heating-air
          - coolpro-heating-cooling
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply prospect configuration
        run: node artifacts/hvac-prospect-template/scripts/apply-prospect-config.mjs "${{ matrix.prospect }}"

      - name: Validate Stage 7 conversion layer
        run: node artifacts/hvac-prospect-template/scripts/validate-stage7-conversion.mjs

      - name: Validate existing prospect safety contract
        run: node artifacts/hvac-prospect-template/scripts/validate-prospect-demo.mjs "${{ matrix.prospect }}"

      - name: Typecheck
        run: pnpm --dir artifacts/hvac-prospect-template run typecheck

      - name: Build
        env:
          PORT: 3000
          BASE_PATH: /
        run: pnpm --dir artifacts/hvac-prospect-template exec vite build --config vite.config.ts
