name: LLF Onboarding CI

on:
  push:
    branches:
      - feature/llf-welcome-onboarding
    paths:
      - 'artifacts/local-lead-forge/**'
      - '.github/workflows/llf-onboarding-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/local-lead-forge/**'
      - '.github/workflows/llf-onboarding-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and build LLF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Local Lead Forge
        run: pnpm --filter @workspace/comfortair-solutions run typecheck

      - name: Build Local Lead Forge
        run: pnpm --filter @workspace/comfortair-solutions run build
