name: LLF Onboarding CI

on:
  push:
    branches:
      - feature/llf-welcome-onboarding
    paths:
      - 'artifacts/local-lead-forge/**'
      - 'infrastructure/cloudflare/local-lead-forge-demo-mailer.worker.js'
      - '.github/workflows/llf-onboarding-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/local-lead-forge/**'
      - 'infrastructure/cloudflare/local-lead-forge-demo-mailer.worker.js'
      - '.github/workflows/llf-onboarding-ci.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, build and onboarding contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Validate Local Lead Forge
        id: validate
        shell: bash
        run: |
          set +e

          node artifacts/local-lead-forge/scripts/validate-onboarding.mjs > llf-ci-onboarding-contract.log 2>&1
          contract_status=$?

          node artifacts/local-lead-forge/scripts/test-onboarding-worker.mjs > llf-ci-worker-contract.log 2>&1
          worker_status=$?

          pnpm install --frozen-lockfile > llf-ci-install.log 2>&1
          install_status=$?

          if [ "$install_status" -eq 0 ]; then
            pnpm --dir artifacts/local-lead-forge run typecheck > llf-ci-typecheck.log 2>&1
            typecheck_status=$?
            pnpm --dir artifacts/local-lead-forge run build > llf-ci-build.log 2>&1
            build_status=$?
          else
            typecheck_status=99
            build_status=99
            echo "Skipped because dependency installation failed." > llf-ci-typecheck.log
            echo "Skipped because dependency installation failed." > llf-ci-build.log
          fi

          {
            echo "contract_status=$contract_status"
            echo "worker_status=$worker_status"
            echo "install_status=$install_status"
            echo "typecheck_status=$typecheck_status"
            echo "build_status=$build_status"
          } | tee llf-ci-summary.txt

          echo "contract_status=$contract_status" >> "$GITHUB_OUTPUT"
          echo "worker_status=$worker_status" >> "$GITHUB_OUTPUT"
          echo "install_status=$install_status" >> "$GITHUB_OUTPUT"
          echo "typecheck_status=$typecheck_status" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload LLF validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llf-onboarding-ci-diagnostics
          path: |
            llf-ci-onboarding-contract.log
            llf-ci-worker-contract.log
            llf-ci-install.log
            llf-ci-typecheck.log
            llf-ci-build.log
            llf-ci-summary.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.validate.outputs.contract_status }}" != "0" ] || \
             [ "${{ steps.validate.outputs.worker_status }}" != "0" ] || \
             [ "${{ steps.validate.outputs.install_status }}" != "0" ] || \
             [ "${{ steps.validate.outputs.typecheck_status }}" != "0" ] || \
             [ "${{ steps.validate.outputs.build_status }}" != "0" ]; then
            echo "LLF validation failed. Download the llf-onboarding-ci-diagnostics artifact for exact logs."
            exit 1
          fi
