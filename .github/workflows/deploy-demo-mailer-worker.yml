name: Deploy Demo Mailer Worker

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/cloudflare/local-lead-forge-demo-mailer.worker.js"
      - "infrastructure/cloudflare/wrangler.jsonc"
      - ".github/workflows/deploy-demo-mailer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure/cloudflare
          wranglerVersion: "4"
          command: deploy

      - name: Smoke test lead delivery
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST "https://local-lead-forge-demo-mailer.localleadforgeagency.workers.dev/" \
            -H "Origin: https://localleadforge.com" \
            -H "Content-Type: application/json" \
            --data '{"name":"LLF Deployment QA","phone":"404-555-0100","issue":"Automated Worker smoke test","location":"Marietta, GA","timing":"Flexible","language":"en","demoEmail":"localleadforgeagency@gmail.com"}'
