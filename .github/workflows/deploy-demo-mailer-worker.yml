name: Deploy Demo Mailer Worker

on:
  push:
    branches:
      - main
    paths:
      - "infrastructure/cloudflare/local-lead-forge-demo-mailer.worker.js"
      - "infrastructure/cloudflare/wrangler.jsonc"
      - ".github/workflows/deploy-demo-mailer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infrastructure/cloudflare
          wranglerVersion: "4"
          command: deploy
