<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ClariSprint Factory</title>
    <meta name="theme-color" content="#030914" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClariSprint Factory" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="https://clarisprint.com/favicon.png" />
    <link rel="apple-touch-icon" href="https://clarisprint.com/favicon.png" />
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020711; color: #fff; padding: 24px; }
      main { width: min(100%, 420px); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 18px; }
      h1 { margin: 0 0 10px; font-size: 30px; }
      p { margin: 0 0 22px; line-height: 1.5; color: #cbd5e1; }
      a { display: inline-block; padding: 14px 18px; border-radius: 12px; background: #fff; color: #020711; text-decoration: none; font-weight: 700; }
      small { display: block; margin-top: 18px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <img src="https://clarisprint.com/favicon.png" alt="ClariSprint" />
      <h1>ClariSprint Factory</h1>
      <p>Preview #222 para instalar y probar la fábrica en este iPhone. Al agregarla a la pantalla de inicio usará el nombre y el icono oficial de ClariSprint.</p>
      <a href="/agent-demo/">Abrir Factory</a>
      <small>Preview solamente - sin merge ni producción.</small>
    </main>
  </body>
</html>
