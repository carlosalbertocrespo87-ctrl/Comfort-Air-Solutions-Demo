<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Local Lead Forge</title>
  <desc id="desc">Official Local Lead Forge horizontal logo with LLF lightning mark and the slogan Turn more visitors into booked jobs.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#b9b9b9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="0.52" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#f04400"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- LLF symbol -->
    <path d="M24 31h58L58 139h67l-12 34H7z" fill="url(#silver)"/>
    <path d="M83 31h55l-20 91h49l-11 31H61z" fill="url(#silver)"/>
    <path d="M151 31h148l-12 38h-83l-10 34h76l-11 35h-73l-8 30-30 24 8-42h-29z" fill="url(#orange)"/>

    <!-- Divider -->
    <path d="M339 18l-28 176" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- Wordmark -->
    <text x="385" y="104" fill="#f7f7f7" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', Arial, sans-serif" font-size="66" font-style="italic" letter-spacing="1">LOCAL</text>
    <text x="615" y="104" fill="#ff6a00" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', Arial, sans-serif" font-size="66" font-style="italic" letter-spacing="1">LEAD</text>
    <text x="828" y="104" fill="#f7f7f7" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', 'Arial Narrow', Arial, sans-serif" font-size="66" font-style="italic" letter-spacing="1">FORGE</text>

    <path d="M386 125h764" stroke="#ff6a00" stroke-width="4"/>
    <text x="386" y="169" fill="#c2c2c2" font-family="Arial Narrow, Arial, sans-serif" font-size="31" font-style="italic" font-weight="700" letter-spacing="1.2">TURN MORE VISITORS INTO BOOKED JOBS.</text>
  </g>
</svg>