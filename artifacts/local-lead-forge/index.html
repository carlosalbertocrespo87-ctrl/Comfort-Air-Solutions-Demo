    <link rel="stylesheet" href="/src/preview-mobile-fixes.css" />
    <style>
      header a[aria-label="Local Lead Forge home"] {
        width: 405px;
        height: 82px;
        flex: 0 0 auto;
        gap: 0 !important;
        background: url("/llf-official-horizontal.jpg") left center / contain no-repeat;
      }
      header a[aria-label="Local Lead Forge home"] > * { display: none !important; }
      footer a[aria-label="Local Lead Forge home"] {
        width: 72px;
        height: 68px;
        flex: 0 0 auto;
        background: url("/llf-official-icon.jpg") center / contain no-repeat;
      }
      footer a[aria-label="Local Lead Forge home"] > * { display: none !important; }
      @media (min-width: 641px) { header > div { height: 96px !important; } }
      @media (max-width: 640px) {
        header a[aria-label="Local Lead Forge home"] { width: 238px; height: 52px; }
        footer a[aria-label="Local Lead Forge home"] { width: 58px; height: 55px; }
      }
    </style>
  </head>
  <body>
    <!-- Static detector form for Netlify Forms. The interactive React form posts to this schema. -->
    <form name="llf-demo-request" method="POST" action="/home-preview" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="llf-demo-request" />
      <input name="bot-field" />
      <input name="source" />
      <input name="name" />
      <input name="business" />
      <input name="email" type="email" />
      <input name="phone" />
      <textarea name="need"></textarea>
    </form>
    <div id="root"></div>
    <script src="/llf-form-endpoint-fix.js"></script>
    <script src="/claims-safety.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
