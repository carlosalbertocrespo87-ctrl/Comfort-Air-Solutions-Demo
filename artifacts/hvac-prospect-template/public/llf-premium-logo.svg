<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-labelledby="title desc">
  <title id="title">Local Lead Forge</title>
  <desc id="desc">LLF premium logo with orange rocket and the slogan Turn more visitors into booked jobs.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#b9c0ca"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb000"/>
      <stop offset="0.45" stop-color="#ff7800"/>
      <stop offset="1" stop-color="#f04400"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a6"/>
      <stop offset="0.35" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff4f00" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000814" flood-opacity="0.9"/>
    </filter>
    <filter id="orangeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <text x="12" y="128" fill="url(#silver)" stroke="#394351" stroke-width="2.4"
      font-family="Impact, Arial Black, Arial, sans-serif" font-size="126" font-style="italic" font-weight="900"
      letter-spacing="-8">LLF</text>

    <g transform="translate(254 13) rotate(16 58 83)" filter="url(#orangeGlow)">
      <path d="M48 142 C35 160 21 174 5 184 C22 155 27 134 26 117 Z" fill="url(#flame)" opacity="0.98"/>
      <path d="M58 137 C48 157 39 171 29 184 C39 154 40 134 38 117 Z" fill="#ff6a00" opacity="0.72"/>
      <path d="M55 118 C42 118 29 126 15 139 C23 116 35 100 50 91 Z" fill="#f45100" stroke="#ff9b24" stroke-width="2"/>
      <path d="M92 109 C105 117 114 129 119 146 C101 137 87 128 78 117 Z" fill="#f45100" stroke="#ff9b24" stroke-width="2"/>
      <path d="M49 118 C47 86 57 48 93 12 C104 45 98 80 78 112 Z" fill="url(#orange)" stroke="#ffc05a" stroke-width="2.3"/>
      <path d="M88 23 C91 45 86 69 73 93" fill="none" stroke="#fff0a8" stroke-width="3" stroke-linecap="round" opacity="0.82"/>
      <circle cx="83" cy="55" r="10" fill="#07111f" stroke="#ffb13b" stroke-width="3"/>
      <path d="M49 118 L65 97 L78 112 L60 136 Z" fill="#ff8a00" stroke="#ffbf58" stroke-width="1.8"/>
    </g>

    <text x="358" y="94" fill="url(#silver)" stroke="#3b4655" stroke-width="0.9"
      font-family="Arial Narrow, Arial, sans-serif" font-size="34" font-style="italic" font-weight="800"
      letter-spacing="1.2">LOCAL LEAD FORGE</text>
    <text x="360" y="147" fill="#ff6a00" font-family="Arial, sans-serif" font-size="23" font-weight="700"
      letter-spacing="0.1">Turn more visitors into booked jobs.</text>
  </g>
</svg>